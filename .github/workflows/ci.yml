name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - name: Build
        run: pnpm build
      - parallel:
          - name: Run Astro check
            run: pnpm check
          - name: Lint
            run: pnpm lint
          - name: Check formatting
            run: pnpm format
          - name: Check unused code and dependencies
            run: pnpm knip
