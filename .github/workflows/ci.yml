name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - name: Build
        run: pnpm build
      - parallel:
          - name: Run type check
            run: pnpm check
          - name: Lint
            run: pnpm lint
          - name: Check formatting
            run: pnpm format
          - name: Check unused code and dependencies
            run: pnpm knip
